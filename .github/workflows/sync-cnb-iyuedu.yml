name: 同步 CNB 上游（i阅读镜像）

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 安装 git-filter-repo
        run: pip install git-filter-repo

      - name: 同步 CNB 上游到镜像仓
        id: sync
        run: node scripts/sync-cnb.mjs
        env:
          MIRROR_TOKEN: ${{ secrets.FORK_TOKEN }}

      - name: Send alert email
        if: always() && steps.sync.outputs.alert == 'true'
        uses: action-pack/send-mail@v1
        with:
          connection_url: ${{ secrets.MAIL_CONNECTION }}
          to: 1220232554@qq.com
          from: 1365443620@qq.com
          subject: "CNB镜像告警：${{ steps.sync.outputs.alert_reason }}"
          body: |
            ${{ steps.sync.outputs.alert_body }}
            详见 workflow 日志。
